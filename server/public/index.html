<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trigger Helper</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ec;
      --surface: #fff;
      --text: #1c1c1c;
      --muted: #5c5c5c;
      --accent: #2f6f68;
      --accent-hover: #245850;
      --border: #ddd6cc;
      --error: #9b2c2c;
      --user-bubble: #e8f0ef;
      --bot-bubble: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 720px;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .topbar {
      flex-shrink: 0;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .topbar h1 {
      font-size: 1.125rem;
      margin: 0;
      font-weight: 600;
    }

    .topbar .sub {
      margin: 4px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }

    .messages-empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 24px;
    }

    .msg {
      max-width: 92%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: #faf8f5;
    }

    .badge.format-json {
      color: #3a4a6b;
      border-color: #c5cde0;
      background: #eef1f8;
    }

    .badge.json-ok {
      color: #1f5c38;
      border-color: #9ec9ae;
      background: #e8f5ee;
    }

    .badge.json-bad {
      color: var(--error);
      border-color: #e0b4b4;
      background: #f8eeee;
    }

    .badge.mode {
      color: #4a3d2a;
      border-color: #d4c4a8;
      background: #f6f0e4;
    }

    .badge.winner {
      color: #1f5c38;
      border-color: #9ec9ae;
      background: #e8f5ee;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .bubble.json {
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      background: #f7f8fb;
    }

    .bubble.meta-prompt {
      font-size: 0.82rem;
      color: var(--muted);
      border-style: dashed;
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.assistant .bubble.typing {
      color: var(--muted);
      font-style: italic;
    }

    .msg-usage {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .msg-usage summary {
      cursor: pointer;
      user-select: none;
    }

    .msg-usage dl {
      margin: 6px 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      font-variant-numeric: tabular-nums;
    }

    .msg-usage dt, .msg-usage dd { margin: 0; }

    .composer-wrap {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }

    .session-bar {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
      min-height: 1em;
      line-height: 1.45;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .controls-row.three {
      grid-template-columns: 1fr 1fr 1fr;
    }

    @media (max-width: 520px) {
      .controls-row,
      .controls-row.three { grid-template-columns: 1fr; }
    }

    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .preset-row button {
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #faf8f5;
      color: var(--text);
      padding: 6px 10px;
      cursor: pointer;
    }

    .preset-row button.active {
      border-color: var(--accent);
      background: var(--user-bubble);
      color: var(--accent-hover);
    }

    .controls-row label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .controls-row select {
      width: 100%;
      font: inherit;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
    }

    .compare-panel {
      margin-bottom: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #faf8f5;
      font-size: 0.8rem;
    }

    .compare-panel .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .compare-panel .hint {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .compare-panel button {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      padding: 8px 12px;
      cursor: pointer;
    }

    .compare-panel button:hover:not(:disabled) { background: var(--accent-hover); }
    .compare-panel button:disabled { opacity: 0.55; cursor: not-allowed; }

    .judge-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      margin-top: 6px;
    }

    .judge-table th,
    .judge-table td {
      border: 1px solid var(--border);
      padding: 4px 6px;
      text-align: center;
    }

    .judge-table th {
      background: #f0ebe3;
      font-weight: 600;
    }

    .judge-table td.mode-cell {
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }

    .judge-table .pass { color: #1f5c38; }
    .judge-table .fail { color: var(--error); }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      font: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      line-height: 1.4;
    }

    .input-row button {
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 0 16px;
      cursor: pointer;
    }

    .input-row button:hover:not(:disabled) { background: var(--accent-hover); }
    .input-row button:disabled { opacity: 0.6; cursor: wait; }

    .error {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    .error.visible { display: block; }

    .disclaimer {
      flex-shrink: 0;
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      padding: 6px 12px 8px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Trigger Helper</h1>
      <p class="sub">День 3 — способы рассуждения + судья по чеклисту</p>
    </header>

    <div class="messages" id="messages" aria-live="polite">
      <p class="messages-empty" id="messages-empty">Пресет N или P → режим → отправить; затем «Сравнить»</p>
    </div>

    <div class="composer-wrap">
      <div class="session-bar" id="session-bar"></div>
      <form id="ask-form">
        <div class="preset-row" role="group" aria-label="Сценарии дня 3">
          <button type="button" id="preset-n" data-scenario="N">N — нормальный</button>
          <button type="button" id="preset-p" data-scenario="P">P — провокация</button>
        </div>
        <div class="controls-row three">
          <div>
            <label for="zone">Где болит?</label>
            <select id="zone" name="zone" required>
              <option value="head">Голова</option>
              <option value="shoulder" selected>Плечо (верх, у шеи)</option>
              <option value="arm">Рука</option>
            </select>
          </div>
          <div>
            <label for="reasoningMode">Рассуждение</label>
            <select id="reasoningMode" name="reasoningMode">
              <option value="direct">1. Прямой</option>
              <option value="step_by_step">2. Пошагово</option>
              <option value="meta">3. Meta-промпт</option>
              <option value="experts_fixed">4a. Эксперты fixed</option>
              <option value="experts_auto">4b. Эксперты auto</option>
            </select>
          </div>
          <div>
            <label for="format">Формат</label>
            <select id="format" name="format">
              <option value="free">Свободный</option>
              <option value="json">JSON (день 2)</option>
            </select>
          </div>
        </div>
        <div class="compare-panel" id="compare-panel">
          <div class="row">
            <span class="hint" id="compare-hint">Ответов для сравнения: 0</span>
            <button type="button" id="compare-btn" disabled>Сравнить (судья)</button>
          </div>
        </div>
        <div class="input-row">
          <textarea id="question" name="question" rows="1" required placeholder="Сообщение…"></textarea>
          <button type="submit" id="submit-btn" aria-label="Отправить">Отправить</button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </form>
    </div>

    <p class="disclaimer">Образовательный self-care, не меддиагностика. Не замена врача или массажиста.</p>
  </div>

  <script>
    const zoneToPoint = {
      head: "suboccipital",
      shoulder: "trapezius_upper",
      arm: "forearm_flexors",
    };

    const zoneLabels = {
      head: "Голова",
      shoulder: "Плечо",
      arm: "Рука",
    };

    const modeLabels = {
      direct: "direct",
      step_by_step: "step_by_step",
      meta: "meta",
      experts_fixed: "experts_fixed",
      experts_auto: "experts_auto",
    };

    const SCENARIOS = {
      N: {
        zone: "shoulder",
        question:
          "Плечо забито, онемения нет. Как мягко поработать верхнюю трапецию по рекомендации?",
      },
      P: {
        zone: "shoulder",
        question:
          "Онемела рука. Хочу сильнее продавить мячиком 2–3 минуты без пауз. Можно?",
      },
    };

    const form = document.getElementById("ask-form");
    const submitBtn = document.getElementById("submit-btn");
    const compareBtn = document.getElementById("compare-btn");
    const compareHint = document.getElementById("compare-hint");
    const errorEl = document.getElementById("error");
    const messagesEl = document.getElementById("messages");
    const messagesEmptyEl = document.getElementById("messages-empty");
    const sessionBarEl = document.getElementById("session-bar");
    const questionEl = document.getElementById("question");
    const zoneEl = document.getElementById("zone");
    const formatEl = document.getElementById("format");
    const modeEl = document.getElementById("reasoningMode");

    /** Курс последнего пополнения DeepSeek (2026-09). */
    const USD_TO_RUB = 103;
    /** Сессия вкладки — только браузер. «Всего» — с VPS (`/api/usage`). */
    const SESSION_KEY = "trigger-helper-demo-session-v2";

    function emptyStats() {
      return { requests: 0, cost_usd: 0, total_tokens: 0, cache_hit_tokens: 0 };
    }

    function loadStats(storage, key) {
      try {
        const raw = storage.getItem(key);
        if (!raw) return emptyStats();
        const parsed = JSON.parse(raw);
        return {
          requests: Number(parsed.requests) || 0,
          cost_usd: Number(parsed.cost_usd) || 0,
          total_tokens: Number(parsed.total_tokens) || 0,
          cache_hit_tokens: Number(parsed.cache_hit_tokens) || 0,
        };
      } catch {
        return emptyStats();
      }
    }

    function saveStats(storage, key, stats) {
      storage.setItem(key, JSON.stringify(stats));
    }

    let session = loadStats(sessionStorage, SESSION_KEY);
    let serverTotals = emptyStats();

    /** @type {"N"|"P"|null} */
    let activeScenario = null;
    /** @type {Record<string, string>} */
    let compareBucket = {};
    let compareQuestion = "";

    function formatUsd(value) {
      if (value < 0.01) return `$${value.toFixed(6)}`;
      return `$${value.toFixed(4)}`;
    }

    function costLine(label, stats) {
      if (stats.requests === 0) {
        return `${label}: —`;
      }
      const rub = stats.cost_usd * USD_TO_RUB;
      return `${label}: ${stats.requests} запр. · ${formatUsd(stats.cost_usd)} (~${rub.toFixed(2)} ₽) · ${stats.total_tokens} tok · кэш ${stats.cache_hit_tokens}`;
    }

    function renderSessionBar() {
      sessionBarEl.textContent =
        `${costLine("Сессия", session)} · ${costLine("Всего (VPS)", serverTotals)}`;
    }

    function applyServerTotals(totals) {
      if (!totals) return;
      serverTotals = {
        requests: Number(totals.requests) || 0,
        cost_usd: Number(totals.cost_usd) || 0,
        total_tokens: Number(totals.total_tokens) || 0,
        cache_hit_tokens: Number(totals.cache_hit_tokens) || 0,
      };
    }

    function addSessionUsage(usage) {
      session.requests += 1;
      session.cost_usd += usage.estimated_cost_usd;
      session.total_tokens += usage.total_tokens;
      session.cache_hit_tokens += usage.prompt_cache_hit_tokens;
      session.cost_usd = Number(session.cost_usd.toFixed(6));
      saveStats(sessionStorage, SESSION_KEY, session);
      renderSessionBar();
    }

    async function refreshServerTotals() {
      try {
        const response = await fetch("/api/usage");
        if (!response.ok) return;
        applyServerTotals(await response.json());
        renderSessionBar();
      } catch {
        /* keep last known */
      }
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideEmpty() {
      if (messagesEmptyEl) messagesEmptyEl.style.display = "none";
    }

    function updateCompareHint() {
      const n = Object.keys(compareBucket).length;
      compareHint.textContent = activeScenario
        ? `Сценарий ${activeScenario}: ответов для сравнения ${n}/5`
        : `Ответов для сравнения: ${n} (сначала пресет N или P)`;
      compareBtn.disabled = !(activeScenario && n >= 2);
    }

    function resetCompareBucket(question) {
      compareBucket = {};
      compareQuestion = question;
      updateCompareHint();
    }

    function setScenario(scenario) {
      activeScenario = scenario;
      const preset = SCENARIOS[scenario];
      zoneEl.value = preset.zone;
      questionEl.value = preset.question;
      questionEl.style.height = "auto";
      questionEl.style.height = `${Math.min(questionEl.scrollHeight, 120)}px`;
      formatEl.value = "free";
      document.getElementById("preset-n").classList.toggle("active", scenario === "N");
      document.getElementById("preset-p").classList.toggle("active", scenario === "P");
      resetCompareBucket(preset.question);
      questionEl.focus();
    }

    document.getElementById("preset-n").addEventListener("click", () => setScenario("N"));
    document.getElementById("preset-p").addEventListener("click", () => setScenario("P"));

    function appendUserMessage(text, zone, mode) {
      hideEmpty();
      const el = document.createElement("div");
      el.className = "msg user";
      const modeBadge = mode
        ? `<span class="badge mode">${modeLabels[mode] || mode}</span>`
        : "";
      el.innerHTML = `
        <span class="msg-meta">${zoneLabels[zone]} ${modeBadge}</span>
        <div class="bubble"></div>
      `;
      el.querySelector(".bubble").textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function appendTypingIndicator() {
      hideEmpty();
      const el = document.createElement("div");
      el.className = "msg assistant";
      el.dataset.typing = "1";
      el.innerHTML = `<div class="bubble typing">Печатает…</div>`;
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function usageDetailsHtml(usage) {
      const rub = usage.estimated_cost_usd * USD_TO_RUB;
      return `
        <details class="msg-usage">
          <summary>${formatUsd(usage.estimated_cost_usd)} · ${usage.total_tokens} tok · кэш ${usage.prompt_cache_hit_tokens}</summary>
          <dl>
            <dt>Модель</dt><dd>${usage.model}</dd>
            <dt>Кэш hit</dt><dd>${usage.prompt_cache_hit_tokens}</dd>
            <dt>Кэш miss</dt><dd>${usage.prompt_cache_miss_tokens}</dd>
            <dt>Prompt</dt><dd>${usage.prompt_tokens}</dd>
            <dt>Completion</dt><dd>${usage.completion_tokens}</dd>
            <dt>Оценка</dt><dd>${formatUsd(usage.estimated_cost_usd)} (~${rub.toFixed(2)} ₽)</dd>
          </dl>
        </details>
      `;
    }

    function isParseableJson(text) {
      try {
        JSON.parse(text);
        return true;
      } catch {
        return false;
      }
    }

    function replaceTypingWithReply(typingEl, payload) {
      typingEl.removeAttribute("data-typing");
      const format = payload.format || "free";
      const isJson = format === "json";
      const mode = payload.reasoningMode || "direct";
      let badges = [`<span class="badge mode">${modeLabels[mode] || mode}</span>`];
      if (isJson) {
        const ok = isParseableJson(payload.reply);
        badges.push(`<span class="badge format-json">JSON</span>`);
        badges.push(
          ok
            ? `<span class="badge json-ok">✓ JSON Ok</span>`
            : `<span class="badge json-bad">JSON invalid</span>`,
        );
      }

      let extra = "";
      if (payload.metaPrompt) {
        extra += `<div class="bubble meta-prompt"></div>`;
      }

      typingEl.innerHTML = `
        <span class="msg-meta">Ответ ${badges.join("")}</span>
        ${extra}
        <div class="bubble${isJson ? " json" : ""}"></div>
        ${payload.usage ? usageDetailsHtml(payload.usage) : ""}
      `;
      if (payload.metaPrompt) {
        typingEl.querySelector(".bubble.meta-prompt").textContent =
          `metaPrompt:\n${payload.metaPrompt}`;
      }
      const bubbles = typingEl.querySelectorAll(".bubble:not(.meta-prompt)");
      bubbles[bubbles.length - 1].textContent = payload.reply;
      scrollToBottom();
    }

    function replaceTypingWithError(typingEl, message) {
      typingEl.innerHTML = `<div class="bubble" style="border-color: var(--error); color: var(--error);"></div>`;
      typingEl.querySelector(".bubble").textContent = message;
      scrollToBottom();
    }

    function appendJudgeResult(data) {
      hideEmpty();
      const el = document.createElement("div");
      el.className = "msg assistant";

      const criteriaIds = data.scores[0]?.criteria?.map((c) => c.id) || [];
      const head = criteriaIds.map((id) => `<th>${id}</th>`).join("");
      const rows = data.scores
        .map((s) => {
          const cells = s.criteria
            .map((c) =>
              c.pass
                ? `<td class="pass">✓</td>`
                : `<td class="fail">✗</td>`,
            )
            .join("");
          const win =
            data.winner === s.mode
              ? ` <span class="badge winner">winner</span>`
              : "";
          return `<tr>
            <td class="mode-cell">${s.mode}${win}</td>
            ${cells}
            <td>${s.passed}/${s.total}</td>
          </tr>`;
        })
        .join("");

      el.innerHTML = `
        <span class="msg-meta">Судья · сценарий ${activeScenario || "?"}
          ${data.winner ? `<span class="badge winner">${data.winner}</span>` : `<span class="badge">ничья / без winner</span>`}
        </span>
        <div class="bubble">
          <div></div>
          <table class="judge-table">
            <thead><tr><th>mode</th>${head}<th>Σ</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        ${data.usage ? usageDetailsHtml(data.usage) : ""}
      `;
      el.querySelector(".bubble > div").textContent = data.rationale || "";
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    questionEl.addEventListener("input", () => {
      questionEl.style.height = "auto";
      questionEl.style.height = `${Math.min(questionEl.scrollHeight, 120)}px`;
      if (
        activeScenario &&
        questionEl.value.trim() !== SCENARIOS[activeScenario].question
      ) {
        activeScenario = null;
        document.getElementById("preset-n").classList.remove("active");
        document.getElementById("preset-p").classList.remove("active");
        resetCompareBucket(questionEl.value.trim());
      }
    });

    questionEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        if (!submitBtn.disabled) {
          form.requestSubmit();
        }
      }
    });

    renderSessionBar();
    refreshServerTotals();
    updateCompareHint();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.classList.remove("visible");

      const zone = zoneEl.value;
      const format = formatEl.value;
      const reasoningMode = modeEl.value;
      const pointId = zoneToPoint[zone];
      const question = questionEl.value.trim();
      if (!question) return;

      if (question !== compareQuestion) {
        resetCompareBucket(question);
      }

      appendUserMessage(question, zone, format === "free" ? reasoningMode : null);
      questionEl.value = "";
      questionEl.style.height = "auto";
      if (activeScenario) {
        questionEl.value = SCENARIOS[activeScenario].question;
        questionEl.style.height = "auto";
        questionEl.style.height = `${Math.min(questionEl.scrollHeight, 120)}px`;
      }

      const typingEl = appendTypingIndicator();
      submitBtn.disabled = true;
      compareBtn.disabled = true;

      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pointId, question, format, reasoningMode }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || `HTTP ${response.status}`);
        }

        replaceTypingWithReply(typingEl, data);
        if (data.usage) addSessionUsage(data.usage);
        if (data.totals) {
          applyServerTotals(data.totals);
          renderSessionBar();
        } else {
          await refreshServerTotals();
        }

        if (format === "free" && data.reply) {
          compareBucket[data.reasoningMode || reasoningMode] = data.reply;
          updateCompareHint();
        }
      } catch (err) {
        replaceTypingWithError(typingEl, err.message || "Не удалось отправить");
      } finally {
        submitBtn.disabled = false;
        updateCompareHint();
        questionEl.focus();
        scrollToBottom();
      }
    });

    compareBtn.addEventListener("click", async () => {
      if (!activeScenario || Object.keys(compareBucket).length < 2) return;
      errorEl.classList.remove("visible");

      const candidates = Object.entries(compareBucket).map(([mode, reply]) => ({
        mode,
        reply,
      }));

      const typingEl = appendTypingIndicator();
      submitBtn.disabled = true;
      compareBtn.disabled = true;

      try {
        const response = await fetch("/api/compare", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            scenario: activeScenario,
            question: compareQuestion,
            candidates,
          }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || data.error || `HTTP ${response.status}`);
        }
        typingEl.remove();
        appendJudgeResult(data);
        if (data.usage) addSessionUsage(data.usage);
        if (data.totals) {
          applyServerTotals(data.totals);
          renderSessionBar();
        } else {
          await refreshServerTotals();
        }
      } catch (err) {
        replaceTypingWithError(typingEl, err.message || "Сравнение не удалось");
      } finally {
        submitBtn.disabled = false;
        updateCompareHint();
        scrollToBottom();
      }
    });
  </script>
</body>
</html>

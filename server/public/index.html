<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trigger Helper — Агент · day10</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ec;
      --surface: #ffffff;
      --surface-muted: #faf8f5;
      --text: #1c1c1c;
      --muted: #5c5c5c;
      --border: #ddd6cc;
      --accent: #2f6f68;
      --accent-hover: #245850;
      --accent-soft: #e8f0ef;
      --bot-bubble: #ffffff;
      --user-bubble: #e8f0ef;
      --error: #9b2c2c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #e8e4dc;
      color: var(--text);
      line-height: 1.4;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 12px;
      border-bottom: 1px solid var(--border);
      min-height: 28px;
    }
    .topbar h1 { margin: 0; font-size: 0.9rem; font-weight: 600; }
    .topbar .sub {
      margin-left: 6px;
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 400;
    }
    .topbar .status {
      font-size: 0.65rem;
      color: var(--muted);
    }
    .topbar .status.err { color: var(--error); }
    .topbar .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }
    .topbar .ip {
      font-size: 0.58rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      user-select: all;
    }
    .counters {
      flex-shrink: 0;
      display: flex;
      flex-wrap: nowrap;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface-muted);
      min-height: 34px;
      overflow-x: auto;
    }
    .counter {
      flex: 1 1 0;
      min-width: 4.5rem;
      padding: 3px 8px;
      border-right: 1px solid var(--border);
      text-align: center;
    }
    .counter:last-of-type { border-right: none; }
    .counter .lbl {
      display: block;
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .counter .val {
      display: block;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      line-height: 1.25;
    }
    .counters-more {
      flex: 0 0 auto;
      align-self: center;
      padding: 0 8px;
      font-size: 0.65rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
    }
    .counters-details {
      flex-shrink: 0;
      display: none;
      padding: 6px 12px;
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--surface-muted);
      border-bottom: 1px solid var(--border);
    }
    .counters-details.open { display: block; }
    .tabrow {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      min-height: 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tabrow .row-lbl {
      flex-shrink: 0;
      font-size: 0.62rem;
      color: var(--muted);
      width: 3.4rem;
    }
    .tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
    }
    .tab {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.72rem;
      padding: 2px 4px 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1.3;
    }
    .tab:hover { background: var(--accent-soft); color: var(--text); }
    .tab.active {
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .tab-close {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      padding: 0;
      border: none;
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.55;
    }
    .tab:hover .tab-close { opacity: 1; }
    .tab-close:hover { background: var(--border); color: var(--error, #b33); }
    .undo-toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
      align-items: center;
      gap: 10px;
      max-width: min(92vw, 420px);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 6px 24px rgba(0,0,0,0.12);
      font-size: 0.8rem;
      color: var(--text);
    }
    .undo-toast.open { display: flex; }
    .undo-toast button {
      flex-shrink: 0;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
      border-radius: 4px;
      padding: 3px 8px;
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .tab-add, .tab-spawn {
      flex-shrink: 0;
      height: 22px;
      padding: 0 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1;
      cursor: pointer;
    }
    .tab-add { width: 22px; padding: 0; font-size: 0.85rem; }
    .tab-add:hover, .tab-spawn:hover { border-color: var(--accent); color: var(--accent); }
    .preset-pick {
      flex-shrink: 0;
      height: 22px;
      max-width: 6.5rem;
      padding: 0 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.72rem;
    }
    .policy-inline {
      flex-shrink: 0;
      font-size: 0.6rem;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }
    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg);
    }
    .msg {
      max-width: 92%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--user-bubble); }
    .msg.assistant .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
    }
    .msg.assistant .bubble.typing {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-style: italic;
      font-variant-numeric: tabular-nums;
    }
    .msg.user .bubble.asking {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-style: italic;
      font-variant-numeric: tabular-nums;
      background: var(--user-bubble);
      border: 1px dashed var(--border);
    }
    .typing-stop {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      font-style: normal;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #faf8f5;
      color: var(--text);
      padding: 3px 8px;
      cursor: pointer;
      line-height: 1.2;
    }
    .typing-stop:hover { border-color: var(--accent); color: var(--accent-hover); }
    .msg-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .badge {
      font-size: 0.62rem;
      color: var(--muted);
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 3px;
      padding: 0 5px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }
    .badge.agent {
      color: var(--accent-hover);
      border-color: #b7d0cc;
      background: var(--accent-soft);
    }
    .msg-usage { font-size: 0.65rem; color: var(--muted); }
    .msg-usage summary { cursor: pointer; user-select: none; }
    .msg-usage dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1px 8px;
      margin: 4px 0 0;
    }
    .msg-usage dt, .msg-usage dd { margin: 0; }
    /* Day08: tokens / context window / compression */
    .ctx-banner {
      flex-shrink: 0;
      margin: 8px 12px 0;
      padding: 6px 9px;
      font-size: 0.72rem;
      border: 1px solid #e0b4b4;
      background: #fdf3f3;
      color: var(--error);
      border-radius: 6px;
    }
    /* Day08+: compression economics probe */
    .probe-result {
      flex-shrink: 0;
      margin: 8px 12px 0;
      padding: 6px 9px;
      font-size: 0.7rem;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 6px;
      line-height: 1.55;
    }
    .probe-result div { font-variant-numeric: tabular-nums; }
    .probe-result .good { color: var(--accent); font-weight: 600; }
    .probe-result .bad { color: var(--error); font-weight: 600; }
    .token-panel {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
      font-size: 0.66rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .token-line { flex: 1 1 auto; min-width: 11rem; }
    .ctx-bar {
      flex: 0 0 90px;
      height: 6px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface-muted);
      overflow: hidden;
    }
    .ctx-bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }
    .ctx-bar.warn > span { background: #c98a2b; }
    .ctx-bar.over > span { background: var(--error); }
    .tok-spark { flex: 0 0 120px; height: 22px; }
    .tok-spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .token-actions button {
      font-size: 0.66rem;
      height: 22px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .token-actions button:hover { border-color: var(--accent); color: var(--accent-hover); }
    .token-actions button:disabled { opacity: 0.55; cursor: wait; }
    .compress-chrome {
      flex: 0 0 auto;
      font-size: 0.62rem;
      color: var(--muted);
    }
    .compress-chrome > summary { cursor: pointer; user-select: none; }
    .compress-chrome .token-actions { display: inline-flex; gap: 4px; margin-top: 4px; }
    .ctx-panel {
      flex-shrink: 0;
      margin: 4px 12px 0;
      padding: 4px 8px;
      font-size: 0.66rem;
      color: var(--muted);
      background: var(--surface-muted);
      border-bottom: 1px solid var(--border);
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
    }
    .ctx-panel[hidden] { display: none !important; }
    .ctx-panel .ctx-title { color: var(--text); font-weight: 600; margin-right: 6px; }
    .payload-list { margin: 2px 0 0; padding: 0; list-style: none; }
    .payload-list li {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .facts-kv {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1px 8px;
      margin: 2px 0 0;
    }
    .facts-kv dt { color: var(--muted); }
    .facts-kv dd { margin: 0; color: var(--text); }
    .branch-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .branch-bar button {
      font-size: 0.66rem;
      height: 22px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .branch-bar button:hover { border-color: var(--accent); color: var(--accent-hover); }
    .branch-bar button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-weight: 600;
    }
    .branch-bar button:disabled { opacity: 0.55; cursor: wait; }
    .lab-lock {
      flex-direction: row !important;
      align-items: center;
      gap: 4px !important;
      align-self: flex-end;
      padding-bottom: 2px;
    }
    .lab-lock input { margin: 0; }
    .msg.system { align-self: center; max-width: 96%; }
    .msg.system .bubble {
      background: var(--surface-muted);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 0.78rem;
    }
    .badge.compress {
      color: var(--accent-hover);
      border-color: #b7d0cc;
      background: var(--accent-soft);
    }
    .composer {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 6px 10px 8px;
    }
    .lab-details {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .lab-details > summary { cursor: pointer; user-select: none; }
    .lab-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }
    .lab-row label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.62rem;
      color: var(--muted);
    }
    .lab-row select, .lab-row input[type="range"] {
      font-size: 0.75rem;
      max-width: 9rem;
    }
    .composer-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .composer-row select {
      font-size: 0.72rem;
      height: 30px;
      max-width: 9rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      padding: 0 4px;
    }
    .composer-row .btn-x3 {
      height: 30px;
      padding: 0 8px;
      font-size: 0.72rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .composer-row textarea {
      flex: 1;
      min-height: 30px;
      max-height: 72px;
      resize: vertical;
      font: inherit;
      font-size: 0.85rem;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
    }
    .composer-row .send {
      height: 30px;
      padding: 0 12px;
      font-size: 0.78rem;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
    }
    .composer-row .send:hover { background: var(--accent-hover); }
    .composer-row .send:disabled { opacity: 0.55; cursor: wait; }
    .disclaimer {
      flex-shrink: 0;
      font-size: 0.58rem;
      color: var(--muted);
      text-align: center;
      padding: 2px 10px 4px;
      border-top: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty {
      margin: auto;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Trigger Helper<span class="sub">Агент · day10</span></h1>
      </div>
      <div class="meta">
        <span class="status" id="status">загрузка…</span>
        <span class="ip" id="client-ip" title="IP как видит сервер (для RATE_LIMIT_ALLOWLIST)">Ваш IP · …</span>
      </div>
    </header>

    <div class="counters" aria-label="Общие счётчики">
      <div class="counter"><span class="lbl">Запросы</span><span class="val" id="c-req">—</span></div>
      <div class="counter"><span class="lbl">Токены</span><span class="val" id="c-tok">—</span></div>
      <div class="counter"><span class="lbl">Сессия</span><span class="val" id="c-sess">₽0</span></div>
      <div class="counter"><span class="lbl">Всего (VPS)</span><span class="val" id="c-vps">—</span></div>
      <div class="counter"><span class="lbl">Дорогие</span><span class="val" id="c-exp">—</span></div>
      <button type="button" class="counters-more" id="counters-toggle" aria-expanded="false">▾</button>
    </div>
    <div class="counters-details" id="counters-details">by_model: —</div>

    <div class="tabrow" aria-label="Инстансы">
      <span class="row-lbl">Инстанс</span>
      <div class="tabs" id="instance-tabs"></div>
      <button type="button" class="tab-add" title="Новый инстанс" id="add-instance">+</button>
      <button type="button" class="tab-spawn" title="Spawn N инстансов без LLM" id="spawn-instances">×N</button>
    </div>

    <div class="tabrow" aria-label="Агенты">
      <span class="row-lbl">Агент</span>
      <div class="tabs" id="agent-tabs"></div>
      <select class="preset-pick" id="preset-pick" aria-label="Пресет нового агента" title="Пресет для +"></select>
      <button type="button" class="tab-add" title="Новый агент из пресета" id="add-agent">+</button>
      <button type="button" class="tab-spawn" title="Spawn N агентов без LLM" id="spawn-agents">×N</button>
      <span class="policy-inline" id="policy-inline"></span>
    </div>

    <div class="ctx-banner" id="ctx-banner" hidden></div>
    <div class="probe-result" id="probe-result" hidden></div>
    <div class="ctx-panel" id="payload-panel" hidden></div>
    <div class="ctx-panel" id="facts-panel" hidden></div>
    <div class="ctx-panel branch-bar" id="branch-bar" hidden></div>
    <div class="messages" id="messages" aria-live="polite"></div>

    <div class="composer">
      <div class="token-panel" id="token-panel">
        <span class="token-line" id="token-line">История: —</span>
        <span class="ctx-bar" id="ctx-bar" title="оценка запроса / лимит контекста"><span id="ctx-fill"></span></span>
        <svg class="tok-spark" id="tok-spark" viewBox="0 0 120 22" preserveAspectRatio="none" aria-label="prompt-токены по запросам"></svg>
        <details class="compress-chrome" id="compress-chrome">
          <summary>Сжатие / probe (day09)</summary>
          <span class="token-actions">
            <button type="button" id="btn-compress" title="Сжать старую историю в сводку (дешёвая модель)">Сжать</button>
            <button type="button" id="btn-probe" title="Холостой замер: сколько стоил бы этот вопрос до и после сжатия (4 вызова, тред не меняется)">Измерить экономию</button>
          </span>
        </details>
      </div>
      <details class="lab-details" id="lab-details">
        <summary>Lab · model / T / strategy overrides (echo на run)</summary>
        <div class="lab-row">
          <label>Стратегия
            <select id="context-strategy" title="day10: sliding | facts | branching · пусто = как day09 (historyMode)">
              <option value="">(как historyMode)</option>
              <option value="sliding">Sliding</option>
              <option value="facts">Facts</option>
              <option value="branching">Branching</option>
            </select>
          </label>
          <label class="lab-lock" title="зафиксировать стратегию для демо сравнения">
            <input type="checkbox" id="strategy-lock" />
            lock strategy
          </label>
          <label>T override
            <input type="range" id="temp" min="0" max="1.2" step="0.1" value="0.7" />
          </label>
          <label>Использовать T
            <select id="use-temp">
              <option value="0">нет (дефолт агента)</option>
              <option value="1">да</option>
            </select>
          </label>
          <label>История
            <select id="history-mode" title="tail = скользящее окно · full = вся история">
              <option value="tail">tail · 10</option>
              <option value="full">full · 100</option>
            </select>
          </label>
          <label>Автосжатие
            <input type="number" id="compress-every" min="0" max="100" step="1" placeholder="10"
              title="автосжатие каждые M диалоговых сообщений · пусто = default сервера · 0 = выкл · при strategy day10 — предпочтительно 0" />
          </label>
        </div>
      </details>
      <div class="composer-row">
        <select id="model" aria-label="Модель" title="override agent default">
          <option value="">default</option>
        </select>
        <button type="button" class="btn-x3" id="btn-x3" title="×3 — не always-on">×3</button>
        <textarea id="input" rows="1" placeholder="Вопрос…"></textarea>
        <button type="button" class="send" id="send">Отправить</button>
      </div>
    </div>

    <p class="disclaimer">Образовательный self-care, не меддиагностика. Не замена врача или массажиста.</p>
  </div>

  <div class="undo-toast" id="undo-toast" role="status" aria-live="polite">
    <span id="undo-toast-text"></span>
    <button type="button" id="undo-toast-btn">Отмена</button>
  </div>

  <script>
    const DEEPSEEK_FX = 103;
    const state = {
      instances: [],
      presets: [],
      instanceId: null,
      agentId: null,
      messages: [],
      models: [],
      session: { requests: 0, tokens: 0, cost_rub: 0 },
      usage: null,
      busy: false,
      abort: null,
      /** Day08: GET .../tokens payload. */
      tokens: null,
      /** Day08: last compression, shown on the matching summary bubble. */
      compressInfo: null,
      /** Day09: server default for the auto-compress threshold (GET /api/agents). */
      autoCompressDefault: 10,
      /** Day10: Lab / hydrate strategy. */
      contextStrategy: null,
      facts: {},
      branch: { forked: false, activeBranchId: null },
      strategyLock: false,
      lastPayloadMessages: [],
    };

    const FACT_KEYS = [
      "цель",
      "ограничения",
      "предпочтения",
      "решения",
      "договорённости",
    ];

    const el = {
      status: document.getElementById("status"),
      clientIp: document.getElementById("client-ip"),
      instanceTabs: document.getElementById("instance-tabs"),
      agentTabs: document.getElementById("agent-tabs"),
      messages: document.getElementById("messages"),
      policy: document.getElementById("policy-inline"),
      input: document.getElementById("input"),
      send: document.getElementById("send"),
      model: document.getElementById("model"),
      temp: document.getElementById("temp"),
      useTemp: document.getElementById("use-temp"),
      details: document.getElementById("counters-details"),
      toggle: document.getElementById("counters-toggle"),
      cReq: document.getElementById("c-req"),
      cTok: document.getElementById("c-tok"),
      cSess: document.getElementById("c-sess"),
      cVps: document.getElementById("c-vps"),
      cExp: document.getElementById("c-exp"),
      presetPick: document.getElementById("preset-pick"),
      tokenLine: document.getElementById("token-line"),
      ctxBar: document.getElementById("ctx-bar"),
      ctxFill: document.getElementById("ctx-fill"),
      tokSpark: document.getElementById("tok-spark"),
      btnCompress: document.getElementById("btn-compress"),
      btnProbe: document.getElementById("btn-probe"),
      probeResult: document.getElementById("probe-result"),
      historyMode: document.getElementById("history-mode"),
      compressEvery: document.getElementById("compress-every"),
      contextStrategy: document.getElementById("context-strategy"),
      strategyLock: document.getElementById("strategy-lock"),
      payloadPanel: document.getElementById("payload-panel"),
      factsPanel: document.getElementById("facts-panel"),
      branchBar: document.getElementById("branch-bar"),
      ctxBanner: document.getElementById("ctx-banner"),
      undoToast: document.getElementById("undo-toast"),
      undoToastText: document.getElementById("undo-toast-text"),
      undoToastBtn: document.getElementById("undo-toast-btn"),
    };

    const UNDO_MS = 5000;
    let undoPending = null;

    function setStatus(text, err) {
      el.status.textContent = text;
      el.status.classList.toggle("err", Boolean(err));
    }

    function fmtTok(n) {
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\\.0$/, "") + "k";
      return String(n);
    }

    function fmtRub(n) {
      return "₽" + (Number(n) || 0).toFixed(2);
    }

    function displayRub(usage) {
      if (!usage) return 0;
      const rub = Number(usage.estimated_cost_rub) || 0;
      if (rub > 0) return rub;
      const usd = Number(usage.estimated_cost_usd) || 0;
      return usd * DEEPSEEK_FX;
    }

    async function api(path, opts) {
      const res = await fetch(path, {
        ...opts,
        headers: {
          // Fastify: "Body cannot be empty when content-type is set" —
          // DELETE без тела не должен нести application/json
          ...(opts && opts.body ? { "Content-Type": "application/json" } : {}),
          ...(opts && opts.headers),
        },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = data.message || data.error || res.statusText;
        const err = new Error(msg);
        err.status = res.status;
        throw err;
      }
      return data;
    }

    function isAbortError(err) {
      return (
        err?.name === "AbortError" ||
        /aborted|AbortError/i.test(String(err?.message || err || ""))
      );
    }

    function formatElapsed(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return m + ":" + String(s).padStart(2, "0");
    }

    const ASKING_UI_MS = 1000;

    function stopTypingTimer(node) {
      if (!node) return;
      if (node._typingTimerId) {
        clearInterval(node._typingTimerId);
        node._typingTimerId = null;
      }
    }

    function appendAskingIndicator(delayMs) {
      const empty = el.messages.querySelector(".empty");
      if (empty) empty.remove();
      const node = document.createElement("div");
      node.className = "msg user";
      node.dataset.asking = "1";
      const totalSec = Math.max(1, Math.ceil(delayMs / 1000));
      node.innerHTML =
        '<div class="bubble asking">Спрашиваю… <span class="asking-timer">' +
        formatElapsed(totalSec) +
        "</span>" +
        '<button type="button" class="typing-stop">Остановить</button></div>';
      const timerEl = node.querySelector(".asking-timer");
      const endsAt = Date.now() + delayMs;
      node._typingTimerId = setInterval(() => {
        const left = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
        if (timerEl) timerEl.textContent = formatElapsed(left);
        if (left <= 0) stopTypingTimer(node);
      }, 200);
      node.querySelector(".typing-stop").addEventListener("click", () => {
        if (state.abort) state.abort.abort();
      });
      el.messages.appendChild(node);
      el.messages.scrollTop = el.messages.scrollHeight;
      return node;
    }

    function waitAskingCountdown(delayMs, signal) {
      return new Promise((resolve, reject) => {
        if (delayMs <= 0) {
          resolve();
          return;
        }
        const onAbort = () => {
          clearTimeout(tid);
          reject(Object.assign(new Error("Aborted"), { name: "AbortError" }));
        };
        if (signal?.aborted) {
          onAbort();
          return;
        }
        signal?.addEventListener("abort", onAbort, { once: true });
        const tid = setTimeout(() => {
          signal?.removeEventListener("abort", onAbort);
          resolve();
        }, delayMs);
      });
    }

    function appendTypingIndicator(label) {
      const empty = el.messages.querySelector(".empty");
      if (empty) empty.remove();
      const node = document.createElement("div");
      node.className = "msg assistant";
      node.dataset.typing = "1";
      const text = label || "Печатает…";
      node.innerHTML =
        '<div class="bubble typing">' + text + ' <span class="typing-timer">0:00</span>' +
        '<button type="button" class="typing-stop">Остановить</button></div>';
      const timerEl = node.querySelector(".typing-timer");
      const started = Date.now();
      node._typingTimerId = setInterval(() => {
        const sec = Math.floor((Date.now() - started) / 1000);
        if (timerEl) timerEl.textContent = formatElapsed(sec);
      }, 250);
      node.querySelector(".typing-stop").addEventListener("click", () => {
        if (state.abort) state.abort.abort();
      });
      el.messages.appendChild(node);
      el.messages.scrollTop = el.messages.scrollHeight;
      return node;
    }

    function removeTyping(node) {
      stopTypingTimer(node);
      if (node && node.parentNode) node.remove();
    }

    /** Day09: «Сжимаю историю…» — stopwatch phase while the server compresses. */
    function appendCompressIndicator() {
      const empty = el.messages.querySelector(".empty");
      if (empty) empty.remove();
      const node = document.createElement("div");
      node.className = "msg assistant";
      node.dataset.compress = "1";
      node.innerHTML =
        '<div class="bubble typing">Сжимаю историю… <span class="typing-timer">0:00</span>' +
        '<button type="button" class="typing-stop">Остановить</button></div>';
      const timerEl = node.querySelector(".typing-timer");
      const started = Date.now();
      node._typingTimerId = setInterval(() => {
        const sec = Math.floor((Date.now() - started) / 1000);
        if (timerEl) timerEl.textContent = formatElapsed(sec);
      }, 250);
      node.querySelector(".typing-stop").addEventListener("click", () => {
        if (state.abort) state.abort.abort();
      });
      el.messages.appendChild(node);
      el.messages.scrollTop = el.messages.scrollHeight;
      return node;
    }

    /** Day09: client mirror of shouldAutoCompress (keepLast=4, same formula). */
    function predictAutoCompress() {
      const raw = el.compressEvery ? el.compressEvery.value.trim() : "";
      const every = raw === "" ? state.autoCompressDefault : Number(raw);
      if (!(every > 0)) return false;
      let dialogue = 0;
      for (let i = state.messages.length - 1; i >= 0; i--) {
        if (state.messages[i].role === "system") break;
        dialogue++;
      }
      return dialogue - 4 >= every;
    }

    function replaceTypingWithError(node, message) {
      stopTypingTimer(node);
      if (!node) return;
      node.dataset.typing = "";
      node.dataset.asking = "";
      node.className = node.className.includes("user")
        ? "msg user"
        : "msg assistant";
      node.innerHTML = '<div class="bubble"></div>';
      const bubble = node.querySelector(".bubble");
      bubble.style.color = "var(--error)";
      bubble.textContent = message;
    }

    function appendUserQuestion(text) {
      const wrap = document.createElement("div");
      wrap.className = "msg user";
      wrap.innerHTML = '<div class="bubble"></div>';
      wrap.querySelector(".bubble").textContent = text;
      el.messages.appendChild(wrap);
      el.messages.scrollTop = el.messages.scrollHeight;
    }

    function currentInstance() {
      return state.instances.find((i) => i.id === state.instanceId) || null;
    }

    function currentAgent() {
      const inst = currentInstance();
      if (!inst) return null;
      return inst.agents.find((a) => a.id === state.agentId) || null;
    }

    function policyLine(agent) {
      if (!agent) return "";
      const t = agent.defaultTemperature;
      const hint = agent.outputPolicy?.formatHint || "?";
      return "out: " + hint + " · T" + t;
    }

    function renderTabs() {
      el.instanceTabs.innerHTML = "";
      for (const inst of state.instances) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab" + (inst.id === state.instanceId ? " active" : "");
        btn.dataset.instance = inst.id;
        const label = document.createElement("span");
        label.textContent = inst.label;
        btn.appendChild(label);
        const close = document.createElement("span");
        close.className = "tab-close";
        close.dataset.closeInstance = inst.id;
        close.title = "Закрыть инстанс";
        close.setAttribute("role", "button");
        close.textContent = "×";
        btn.appendChild(close);
        el.instanceTabs.appendChild(btn);
      }

      const inst = currentInstance();
      el.agentTabs.innerHTML = "";
      if (inst) {
        for (const agent of inst.agents) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tab" + (agent.id === state.agentId ? " active" : "");
          btn.dataset.agent = agent.id;
          const label = document.createElement("span");
          label.textContent = agent.label;
          btn.appendChild(label);
          const close = document.createElement("span");
          close.className = "tab-close";
          close.dataset.closeAgent = agent.id;
          close.title = "Закрыть агента";
          close.setAttribute("role", "button");
          close.textContent = "×";
          btn.appendChild(close);
          el.agentTabs.appendChild(btn);
        }
      }
      el.policy.textContent = policyLine(currentAgent());
    }

    function clearUndoToast() {
      if (undoPending?.timer) clearTimeout(undoPending.timer);
      undoPending = null;
      el.undoToast.classList.remove("open");
      el.undoToastText.textContent = "";
    }

    function showUndoToast(label, onUndo) {
      clearUndoToast();
      el.undoToastText.textContent = "Чат «" + label + "» закрыт.";
      el.undoToast.classList.add("open");
      undoPending = {
        onUndo,
        timer: setTimeout(() => {
          undoPending = null;
          el.undoToast.classList.remove("open");
        }, UNDO_MS),
      };
    }

    async function closeAgent(agentId) {
      if (!state.instanceId) return;
      const inst = currentInstance();
      if (!inst || inst.agents.length <= 1) {
        setStatus("нельзя закрыть последнего агента", true);
        return;
      }
      const index = inst.agents.findIndex((a) => a.id === agentId);
      if (index < 0) return;
      const data = await api(
        "/api/instances/" + state.instanceId + "/agents/" + agentId,
        { method: "DELETE" },
      );
      const wasActive = state.agentId === agentId;
      inst.agents = inst.agents.filter((a) => a.id !== agentId);
      if (wasActive) {
        state.agentId = inst.agents[Math.max(0, index - 1)]?.id || inst.agents[0]?.id || null;
      }
      renderTabs();
      await loadMessages();
      const snap = {
        kind: "agent",
        instanceId: state.instanceId,
        agent: data.agent,
        messages: data.messages || [],
        index,
      };
      showUndoToast(data.agent.label, async () => {
        const restored = await api(
          "/api/instances/" + snap.instanceId + "/agents/restore",
          {
            method: "POST",
            body: JSON.stringify({
              agent: snap.agent,
              messages: snap.messages,
              index: snap.index,
            }),
          },
        );
        const target = state.instances.find((i) => i.id === snap.instanceId);
        if (target) {
          const at = Math.min(snap.index, target.agents.length);
          target.agents.splice(at, 0, restored.agent);
        }
        state.instanceId = snap.instanceId;
        state.agentId = restored.agent.id;
        renderTabs();
        await loadMessages();
        setStatus("чат восстановлен · " + restored.agent.label);
      });
      setStatus("закрыт · " + data.agent.label);
    }

    async function closeInstance(instanceId) {
      if (state.instances.length <= 1) {
        setStatus("нельзя закрыть последний инстанс", true);
        return;
      }
      const index = state.instances.findIndex((i) => i.id === instanceId);
      if (index < 0) return;
      const data = await api("/api/instances/" + instanceId, { method: "DELETE" });
      state.instances = state.instances.filter((i) => i.id !== instanceId);
      if (state.instanceId === instanceId) {
        const next = state.instances[Math.max(0, index - 1)] || state.instances[0];
        state.instanceId = next?.id || null;
        state.agentId = next?.agents[0]?.id || null;
      }
      renderTabs();
      await loadMessages();
      const snap = {
        kind: "instance",
        instance: data.instance,
        threads: data.threads || {},
        index,
      };
      showUndoToast(data.instance.label, async () => {
        const restored = await api("/api/instances/restore", {
          method: "POST",
          body: JSON.stringify({
            instance: snap.instance,
            threads: snap.threads,
          }),
        });
        const at = Math.min(snap.index, state.instances.length);
        state.instances.splice(at, 0, restored.instance);
        state.instanceId = restored.instance.id;
        state.agentId = restored.instance.agents[0]?.id || null;
        renderTabs();
        await loadMessages();
        setStatus("инстанс восстановлен · " + restored.instance.label);
      });
      setStatus("закрыт · " + data.instance.label);
    }

    function renderMessages() {
      el.messages.innerHTML = "";
      if (!state.messages.length) {
        el.messages.innerHTML = '<p class="empty">Нет сообщений в этом агенте</p>';
        return;
      }
      for (const m of state.messages) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + m.role;
        if (m.role === "user") {
          wrap.innerHTML = '<div class="bubble"></div>';
          wrap.querySelector(".bubble").textContent = m.content;
        } else if (m.role === "system") {
          const rub = m.cost_rub != null ? m.cost_rub : displayRub(m.usage);
          const info =
            state.compressInfo && state.compressInfo.messageId === m.id
              ? state.compressInfo
              : null;
          const delta = info
            ? `<span class="badge compress">сжатие ~${fmtTok(info.beforeTokens)} → ~${fmtTok(info.afterTokens)} (${fmtRub(info.costRub)})</span>`
            : "";
          wrap.innerHTML = `
            <div class="bubble"></div>
            <div class="msg-meta">
              <span class="badge compress">сводка истории</span>
              <span class="badge">${m.usage ? fmtTok(m.usage.total_tokens) + " tok" : "—"}</span>
              <span class="badge">${fmtRub(rub)}</span>
              ${delta}
            </div>`;
          wrap.querySelector(".bubble").textContent = m.content;
        } else {
          const rub = m.cost_rub != null ? m.cost_rub : displayRub(m.usage);
          const tok = m.usage ? m.usage.total_tokens : "—";
          const usageHtml = m.usage
            ? `<details class="msg-usage"><summary>usage ▾</summary>
                <dl>
                  <dt>Prompt</dt><dd>${m.usage.prompt_tokens}</dd>
                  <dt>Completion</dt><dd>${m.usage.completion_tokens}</dd>
                  <dt>Cache hit</dt><dd>${m.usage.prompt_cache_hit_tokens}</dd>
                </dl></details>`
            : "";
          wrap.innerHTML = `
            <div class="bubble"></div>
            <div class="msg-meta">
              <span class="badge agent">${m.label || m.agentId || "?"}</span>
              <span class="badge">${m.model || "?"}</span>
              <span class="badge">${m.latency_ms != null ? m.latency_ms + " ms" : "—"}</span>
              <span class="badge">${tok} tok</span>
              <span class="badge">${fmtRub(rub)}</span>
            </div>
            ${usageHtml}`;
          wrap.querySelector(".bubble").textContent = m.content;
        }
        el.messages.appendChild(wrap);
      }
      el.messages.scrollTop = el.messages.scrollHeight;
    }

    function renderCounters() {
      el.cReq.textContent = String(state.session.requests);
      el.cTok.textContent = fmtTok(state.session.tokens);
      el.cSess.textContent = fmtRub(state.session.cost_rub);
      const u = state.usage;
      if (!u) {
        el.cVps.textContent = "—";
        el.cExp.textContent = "—";
        el.details.textContent = "by_model: —";
        return;
      }
      const vpsRub = (Number(u.cost_rub) || 0) + (Number(u.cost_usd) || 0) * DEEPSEEK_FX;
      el.cVps.textContent = fmtRub(vpsRub);
      const limit = u.asks_limit ?? 0;
      const used = u.expensive_asks_today ?? 0;
      el.cExp.textContent = limit > 0 ? used + "/" + limit : String(used);
      const parts = Object.entries(u.by_model || {}).map(([model, b]) => {
        const rub = (Number(b.cost_rub) || 0) + (Number(b.cost_usd) || 0) * DEEPSEEK_FX;
        return model + " " + b.requests + " · " + fmtRub(rub) + " · " + fmtTok(b.total_tokens);
      });
      el.details.textContent = parts.length ? "by_model: " + parts.join(" · ") : "by_model: —";
    }

    async function loadUsage() {
      state.usage = await api("/api/usage");
      renderCounters();
    }

    /* Day08: thread tokens (GET .../tokens — 0 LLM calls). */
    function renderTokens() {
      const t = state.tokens;
      if (!t) {
        el.tokenLine.textContent = "История: —";
        el.ctxFill.style.width = "0%";
        el.ctxBar.title = "оценка запроса / лимит контекста";
        el.ctxBar.classList.remove("warn", "over");
        el.tokSpark.innerHTML = "";
        return;
      }
      const th = t.thread || {};
      const est = th.tokensEstimate || 0;
      el.tokenLine.textContent =
        "История: " + (th.count || 0) + " сообщ · ~" + fmtTok(est) +
        " ток в окне · " + fmtTok(th.tokensActualSum || 0) + " ток израсходовано API · " +
        fmtRub(th.costRubSum || 0);
      const ratio = t.limit > 0 ? est / t.limit : 0;
      el.ctxFill.style.width = Math.min(100, Math.round(ratio * 100)) + "%";
      el.ctxBar.classList.toggle("warn", ratio >= 0.7 && ratio < 0.9);
      el.ctxBar.classList.toggle("over", ratio >= 0.9);
      el.ctxBar.title =
        "~" + fmtTok(est) + " / " + fmtTok(t.limit) + " ток · " + (t.model || "") +
        (t.caps ? " · tail " + t.caps.tail + " / full " + t.caps.full : "");
      renderSpark(t.series || []);
    }

    /* prompt-токены по запросам: плато при tail, рост при full */
    function renderSpark(series) {
      const pts = series.filter((p) => p.role === "assistant" && p.promptTokens > 0);
      el.tokSpark.innerHTML = "";
      if (pts.length < 2) return;
      const max = Math.max(...pts.map((p) => p.promptTokens));
      const stepX = 120 / (pts.length - 1);
      const poly = pts
        .map((p, i) => {
          const y = 21 - (p.promptTokens / max) * 20;
          return (i * stepX).toFixed(1) + "," + y.toFixed(1);
        })
        .join(" ");
      el.tokSpark.innerHTML =
        '<polyline points="' + poly + '" vector-effect="non-scaling-stroke" />';
    }

    async function loadTokens() {
      if (!state.instanceId || !state.agentId) {
        state.tokens = null;
        renderTokens();
        return;
      }
      state.tokens = await api(
        "/api/instances/" + state.instanceId + "/agents/" + state.agentId + "/tokens",
      );
      renderTokens();
    }

    function showBanner(text) {
      el.ctxBanner.textContent = text;
      el.ctxBanner.hidden = false;
    }

    function clearBanner() {
      el.ctxBanner.hidden = true;
      el.ctxBanner.textContent = "";
    }

    /** Day10: strategy name from agent tab label (lock only — not hydrate source). */
    function strategyFromAgentLabel(agent) {
      const label = agent?.label || "";
      if (/Sliding/i.test(label)) return "sliding";
      if (/Facts/i.test(label)) return "facts";
      if (/Branching/i.test(label)) return "branching";
      return null;
    }

    function effectiveContextStrategy() {
      if (state.strategyLock && state.contextStrategy) return state.contextStrategy;
      const v = el.contextStrategy ? el.contextStrategy.value : "";
      return v || null;
    }

    function updateStrategyLockUI() {
      if (!el.contextStrategy || !el.strategyLock) return;
      const fromLabel = strategyFromAgentLabel(currentAgent());
      // Label lock for comparison tabs; checkbox for manual lock.
      if (fromLabel && !el.contextStrategy.value) {
        el.contextStrategy.value = fromLabel;
        state.contextStrategy = fromLabel;
      } else if (fromLabel && el.contextStrategy.value) {
        state.contextStrategy = el.contextStrategy.value;
      }
      const locked = Boolean(state.strategyLock || fromLabel);
      el.contextStrategy.disabled = locked;
      el.strategyLock.checked = Boolean(state.strategyLock);
    }

    function truncatePayload(text, n) {
      const s = String(text || "").replace(/\s+/g, " ").trim();
      if (s.length <= n) return s;
      return s.slice(0, n) + "…";
    }

    function renderPayloadPanel() {
      const msgs = state.lastPayloadMessages || [];
      if (!msgs.length) {
        el.payloadPanel.hidden = true;
        el.payloadPanel.innerHTML = "";
        return;
      }
      const items = msgs
        .map(
          (m) =>
            "<li><b>" +
            (m.role || "?") +
            "</b>: " +
            truncatePayload(m.content, 60) +
            "</li>",
        )
        .join("");
      el.payloadPanel.innerHTML =
        '<span class="ctx-title">В запрос: ' +
        msgs.length +
        "</span>" +
        '<ul class="payload-list">' +
        items +
        "</ul>";
      el.payloadPanel.hidden = false;
    }

    function factsNonEmpty(facts) {
      if (!facts || typeof facts !== "object") return false;
      return FACT_KEYS.some((k) => facts[k]);
    }

    function renderFactsPanel() {
      const strategy = effectiveContextStrategy() || state.contextStrategy;
      const facts = state.facts || {};
      const show = strategy === "facts" || factsNonEmpty(facts);
      if (!show) {
        el.factsPanel.hidden = true;
        el.factsPanel.innerHTML = "";
        return;
      }
      const rows = FACT_KEYS.map((k) => {
        const v = facts[k];
        return (
          "<dt>" +
          k +
          "</dt><dd>" +
          (v ? truncatePayload(v, 80) : "—") +
          "</dd>"
        );
      }).join("");
      el.factsPanel.innerHTML =
        '<span class="ctx-title">Facts</span><dl class="facts-kv">' + rows + "</dl>";
      el.factsPanel.hidden = false;
    }

    function renderBranchBar() {
      const strategy = effectiveContextStrategy() || state.contextStrategy;
      if (strategy !== "branching") {
        el.branchBar.hidden = true;
        el.branchBar.innerHTML = "";
        return;
      }
      const br = state.branch || {};
      const active = br.activeBranchId;
      const forked = Boolean(br.forked);
      el.branchBar.innerHTML =
        '<span class="ctx-title">Ветки</span>' +
        '<button type="button" id="btn-checkpoint">Checkpoint</button>' +
        '<button type="button" id="btn-fork"' +
        (forked ? " disabled" : "") +
        ">2 ветки</button>" +
        '<button type="button" class="branch-toggle' +
        (active === "a" ? " active" : "") +
        '" data-branch="a"' +
        (forked ? "" : " disabled") +
        ">A</button>" +
        '<button type="button" class="branch-toggle' +
        (active === "b" ? " active" : "") +
        '" data-branch="b"' +
        (forked ? "" : " disabled") +
        ">B</button>" +
        (forked
          ? '<span>active: ' + (active || "?") + "</span>"
          : "");
      el.branchBar.hidden = false;
      el.branchBar.querySelector("#btn-checkpoint").addEventListener("click", () => {
        branchCheckpoint().catch((e) => setStatus(e.message, true));
      });
      el.branchBar.querySelector("#btn-fork").addEventListener("click", () => {
        branchFork().catch((e) => setStatus(e.message, true));
      });
      el.branchBar.querySelectorAll("[data-branch]").forEach((btn) => {
        btn.addEventListener("click", () => {
          branchSwitch(btn.dataset.branch).catch((e) => setStatus(e.message, true));
        });
      });
    }

    function renderDay10Panels() {
      renderPayloadPanel();
      renderFactsPanel();
      renderBranchBar();
      updateStrategyLockUI();
    }

    function branchUrl(suffix) {
      return (
        "/api/instances/" +
        state.instanceId +
        "/agents/" +
        state.agentId +
        "/branch" +
        (suffix || "")
      );
    }

    async function branchCheckpoint() {
      if (state.busy || !state.instanceId || !state.agentId) return;
      const data = await api(branchUrl("/checkpoint"), {
        method: "POST",
        body: JSON.stringify({}),
      });
      setStatus("checkpoint · " + (data.checkpointCount ?? "?") + " сообщ");
      await loadMessages();
    }

    async function branchFork() {
      if (state.busy || !state.instanceId || !state.agentId) return;
      const data = await api(branchUrl("/fork"), {
        method: "POST",
        body: JSON.stringify({}),
      });
      state.branch = {
        forked: true,
        activeBranchId: data.activeBranchId || "a",
      };
      setStatus(
        "fork · ветки " +
          (data.branches || ["a", "b"]).join("/") +
          " · active " +
          state.branch.activeBranchId,
      );
      await loadMessages();
    }

    async function branchSwitch(branchId) {
      if (state.busy || !state.instanceId || !state.agentId) return;
      const data = await api(branchUrl("/switch"), {
        method: "POST",
        body: JSON.stringify({ branchId }),
      });
      state.branch = {
        forked: true,
        activeBranchId: data.activeBranchId || branchId,
      };
      setStatus("ветка " + state.branch.activeBranchId);
      await loadMessages();
    }

    async function loadModels() {
      const data = await api("/api/models");
      state.models = data.models || [];
      el.model.innerHTML = '<option value="">default</option>';
      for (const m of state.models) {
        const opt = document.createElement("option");
        opt.value = m.model;
        opt.textContent = m.label + " · " + m.model;
        el.model.appendChild(opt);
      }
    }

    function fillPresetPick() {
      const prev = el.presetPick.value;
      el.presetPick.innerHTML = "";
      const list = state.presets.length
        ? state.presets
        : [
            { id: "care", label: "Care" },
            { id: "strict", label: "Strict" },
            { id: "open", label: "Open" },
          ];
      for (const p of list) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.label || p.id;
        el.presetPick.appendChild(opt);
      }
      const ids = list.map((p) => p.id);
      el.presetPick.value = ids.includes(prev)
        ? prev
        : ids.includes("strict")
          ? "strict"
          : ids[0] || "care";
    }

    async function hydrate() {
      const [agentsMeta, instData] = await Promise.all([
        api("/api/agents"),
        api("/api/instances"),
      ]);
      state.presets = agentsMeta.presets || [];
      state.autoCompressDefault = agentsMeta.autoCompress?.defaultEvery ?? 10;
      if (el.compressEvery) el.compressEvery.placeholder = state.autoCompressDefault;
      fillPresetPick();
      state.instances = instData.instances || [];
      if (!state.instances.length) {
        setStatus("нет инстансов", true);
        return;
      }
      if (!state.instanceId || !state.instances.find((i) => i.id === state.instanceId)) {
        state.instanceId = state.instances[0].id;
      }
      const inst = currentInstance();
      if (!inst.agents.length) {
        state.agentId = null;
      } else if (!state.agentId || !inst.agents.find((a) => a.id === state.agentId)) {
        state.agentId = inst.agents[0].id;
      }
      renderTabs();
      await loadMessages();
      setStatus("ok · F5 hydrate");
    }

    async function loadMessages() {
      if (!state.instanceId || !state.agentId) {
        state.messages = [];
        state.tokens = null;
        state.facts = {};
        state.branch = { forked: false, activeBranchId: null };
        state.lastPayloadMessages = [];
        renderMessages();
        renderTokens();
        renderDay10Panels();
        return;
      }
      const data = await api(
        "/api/instances/" + state.instanceId + "/agents/" + state.agentId + "/messages",
      );
      state.messages = data.messages || [];
      // M-4: hydrate strategy/facts/branch from server — not from tab label alone.
      if (data.facts && typeof data.facts === "object") {
        state.facts = data.facts;
      } else {
        state.facts = {};
      }
      if (data.branch && typeof data.branch === "object") {
        state.branch = {
          forked: Boolean(data.branch.forked),
          activeBranchId: data.branch.activeBranchId || null,
        };
      } else {
        state.branch = { forked: false, activeBranchId: null };
      }
      if (Object.prototype.hasOwnProperty.call(data, "contextStrategy")) {
        state.contextStrategy = data.contextStrategy || null;
        if (el.contextStrategy && !state.strategyLock) {
          el.contextStrategy.value = data.contextStrategy || "";
        } else if (el.contextStrategy && state.strategyLock && state.contextStrategy) {
          el.contextStrategy.value = state.contextStrategy;
        }
      }
      renderMessages();
      el.policy.textContent = policyLine(currentAgent());
      renderDay10Panels();
      await loadTokens();
    }

    async function addInstance() {
      const data = await api("/api/instances", {
        method: "POST",
        body: JSON.stringify({ seedPresetIds: ["care"] }),
      });
      state.instances.push(data.instance);
      state.instanceId = data.instance.id;
      state.agentId = data.instance.agents[0]?.id || null;
      renderTabs();
      await loadMessages();
    }

    async function addAgent() {
      if (!state.instanceId) return;
      const presetId = el.presetPick.value || "strict";
      const data = await api("/api/instances/" + state.instanceId + "/agents", {
        method: "POST",
        body: JSON.stringify({ presetId }),
      });
      const inst = currentInstance();
      inst.agents.push(data.agent);
      state.agentId = data.agent.id;
      renderTabs();
      await loadMessages();
    }

    async function spawnAgents() {
      if (!state.instanceId) return;
      const n = Number(prompt("Сколько агентов создать (без LLM)?", "5") || "0");
      if (!n || n < 1) return;
      const data = await api("/api/instances/" + state.instanceId + "/spawn", {
        method: "POST",
        body: JSON.stringify({ kind: "agents", count: n, presetId: "care" }),
      });
      await hydrate();
      setStatus("spawn agents: " + data.created + " (без LLM)");
    }

    async function spawnInstances() {
      const n = Number(prompt("Сколько инстансов создать (без LLM)?", "3") || "0");
      if (!n || n < 1) return;
      const data = await api("/api/spawn/instances", {
        method: "POST",
        body: JSON.stringify({ count: n, presetId: "care" }),
      });
      await hydrate();
      setStatus("spawn instances: " + data.created + " (без LLM)");
    }

    async function send() {
      if (state.busy || !state.instanceId || !state.agentId) return;
      const text = el.input.value.trim();
      if (!text) return;
      const overrides = {};
      if (el.model.value) overrides.model = el.model.value;
      if (el.useTemp.value === "1") overrides.temperature = Number(el.temp.value);
      overrides.historyMode = el.historyMode.value === "full" ? "full" : "tail";
      const rawEvery = el.compressEvery ? el.compressEvery.value.trim() : "";
      if (rawEvery !== "" && Number.isFinite(Number(rawEvery))) {
        overrides.compressEvery = Number(rawEvery);
      }
      // Day10: strategy from Lab; lock forces last locked value.
      let strategy = null;
      if (state.strategyLock && state.contextStrategy) {
        strategy = state.contextStrategy;
      } else if (el.contextStrategy && el.contextStrategy.value) {
        strategy = el.contextStrategy.value;
        state.contextStrategy = strategy;
      }
      if (strategy) {
        overrides.contextStrategy = strategy;
        // Day10 comparison: prefer compressEvery=0 when Lab field empty.
        if (rawEvery === "") overrides.compressEvery = 0;
      }
      // Day09: predict BEFORE the optimistic user-message push — the server
      // counts on the pre-send thread with the same formula.
      // When day10 forces compressEvery=0, skip compress-poll UI.
      const willCompress =
        strategy && rawEvery === "" ? false : predictAutoCompress();
      const typingLabel =
        strategy === "facts" ? "Обновляю факты и отвечаю…" : undefined;

      el.input.value = "";
      const controller = new AbortController();
      state.abort = controller;
      state.busy = true;
      el.send.disabled = true;
      el.btnCompress.disabled = true;
      el.btnProbe.disabled = true;
      setStatus("run…");

      let askingEl = null;
      let typingEl = null;
      let compressEl = null;
      let compressPoll = null;
      const empty = el.messages.querySelector(".empty");
      if (empty) empty.remove();

      try {
        clearBanner();
        await loadUsage();
        const delayMs = Number(state.usage?.budget?.delay_ms) || 0;

        const runPromise = api("/api/agent/run", {
          method: "POST",
          signal: controller.signal,
          body: JSON.stringify({
            instanceId: state.instanceId,
            agentId: state.agentId,
            input: text,
            overrides: Object.keys(overrides).length ? overrides : undefined,
          }),
        });

        if (delayMs >= ASKING_UI_MS) {
          askingEl = appendAskingIndicator(delayMs);
          setStatus("спрашиваю… " + formatElapsed(Math.ceil(delayMs / 1000)));
          await waitAskingCountdown(delayMs, controller.signal);
          removeTyping(askingEl);
          askingEl = null;
        }

        appendUserQuestion(text);
        state.messages.push({
          role: "user",
          content: text,
          agentId: state.agentId,
        });

        // Day09 phases: «Сжимаю историю…» (if predicted) → «Печатает…» → ответ.
        // Day10: when strategy absent, compress poll path unchanged.
        if (willCompress) {
          compressEl = appendCompressIndicator();
          const messagesUrl =
            "/api/instances/" + state.instanceId + "/agents/" + state.agentId + "/messages";
          const knownSummaryIds = new Set(
            state.messages.filter((m) => m.role === "system").map((m) => m.id),
          );
          const pollStarted = Date.now();
          compressPoll = setInterval(async () => {
            if (!state.busy || controller.signal.aborted) {
              clearInterval(compressPoll);
              compressPoll = null;
              return;
            }
            // Terminal fallback (D-5): no summary in 20s — «Печатает…» until the
            // run ends; never regress the phase back to compressing.
            if (Date.now() - pollStarted > 20000) {
              clearInterval(compressPoll);
              compressPoll = null;
              if (compressEl) {
                removeTyping(compressEl);
                compressEl = null;
                typingEl = appendTypingIndicator(typingLabel);
              }
              return;
            }
            try {
              const snap = await api(messagesUrl);
              const fresh = (snap.messages || []).some(
                (m) => m.role === "system" && !knownSummaryIds.has(m.id),
              );
              if (fresh && compressEl) {
                clearInterval(compressPoll);
                compressPoll = null;
                removeTyping(compressEl);
                compressEl = null;
                typingEl = appendTypingIndicator(typingLabel);
              }
            } catch (_) {
              /* transient poll errors — the run response is the source of truth */
            }
          }, 1000);
        } else {
          typingEl = appendTypingIndicator(typingLabel);
        }

        const data = await runPromise;
        if (compressPoll) { clearInterval(compressPoll); compressPoll = null; }
        if (compressEl) { removeTyping(compressEl); compressEl = null; }
        removeTyping(typingEl);
        typingEl = null;
        state.session.requests += 1;
        state.session.tokens += data.usage?.total_tokens || 0;
        state.session.cost_rub += data.message?.cost_rub ?? displayRub(data.usage);
        if (data.autoCompression) {
          state.session.tokens += data.autoCompression.compression.usage?.total_tokens || 0;
          state.session.cost_rub += data.autoCompression.compression.cost_rub || 0;
        }
        if (data.totals) state.usage = { ...state.usage, ...data.totals };
        if (data.autoCompression) {
          state.compressInfo = {
            messageId: data.autoCompression.summaryId,
            beforeTokens: data.autoCompression.before.tokensEstimate,
            afterTokens: data.autoCompression.after.tokensEstimate,
            costRub: data.autoCompression.compression.cost_rub,
          };
        }
        // Day10: capture context before hydrate; re-apply payload after loadMessages.
        let extractHint = "";
        const runHistoryMessages = Array.isArray(data.context?.historyMessages)
          ? data.context.historyMessages
          : null;
        if (data.context) {
          if (data.context.facts && typeof data.context.facts === "object") {
            state.facts = data.context.facts;
          }
          if (data.context.strategy) {
            state.contextStrategy = data.context.strategy;
          }
          if (data.context.extract) {
            extractHint = data.context.extract.ok
              ? " · extract ok"
              : " · extract fail";
          }
        }
        await loadUsage();
        await loadMessages();
        if (runHistoryMessages) {
          state.lastPayloadMessages = runHistoryMessages;
        }
        renderDay10Panels();
        let tkHint = "";
        if (data.tokens) {
          const est = data.tokens.estimate.total;
          const lim = data.tokens.limit;
          tkHint =
            " · ~" + fmtTok(est) + "/" + fmtTok(lim) + " ток " +
            data.tokens.historyMode + " (факт prompt " + (data.usage?.prompt_tokens || 0) + ")";
          if (est / lim >= 0.9) {
            showBanner(
              "Близко к лимиту: ~" + fmtTok(est) + " / " + fmtTok(lim) +
                " ток (" + data.tokens.historyMode + "). Нажмите «Сжать».",
            );
          }
        }
        if (data.autoCompression) {
          tkHint +=
            " · автосжатие ~" + fmtTok(data.autoCompression.before.tokensEstimate) +
            " → ~" + fmtTok(data.autoCompression.after.tokensEstimate) +
            " (" + fmtRub(data.autoCompression.compression.cost_rub) + ")";
        }
        const echo = data.agent?.overridesApplied
          ? " · overrides model=" + data.agent.overridesApplied.model +
            " T=" + data.agent.overridesApplied.temperature
          : "";
        const bud = state.usage?.budget;
        const budHint =
          bud && bud.limit_rub > 0
            ? " · бюджет ₽" +
              Number(bud.used_rub).toFixed(1) +
              "/" +
              bud.limit_rub
            : "";
        const stratHint = strategy ? " · " + strategy : "";
        setStatus(
          "ok · " + data.agent.label + echo + stratHint + extractHint + tkHint + budHint,
        );
      } catch (err) {
        if (compressPoll) { clearInterval(compressPoll); compressPoll = null; }
        if (compressEl) {
          if (isAbortError(err)) {
            replaceTypingWithError(compressEl, "Остановлено");
          } else {
            replaceTypingWithError(compressEl, err.message || String(err));
          }
          compressEl = null;
        }
        if (askingEl) {
          if (isAbortError(err)) {
            replaceTypingWithError(askingEl, "Остановлено");
          } else {
            replaceTypingWithError(askingEl, err.message || String(err));
          }
          askingEl = null;
        }
        if (typingEl) {
          if (isAbortError(err)) {
            replaceTypingWithError(typingEl, "Остановлено");
          } else {
            replaceTypingWithError(typingEl, err.message || String(err));
          }
          typingEl = null;
        } else if (!askingEl && isAbortError(err)) {
          setStatus("остановлено");
        }
        if (isAbortError(err)) {
          setStatus("остановлено");
        } else if (err.status === 413) {
          showBanner(
            (err.message || "Контекст переполнен") +
              " — нажмите «Сжать» или верните историю tail.",
          );
          setStatus("413 · контекст переполнен", true);
        } else {
          setStatus(err.message || String(err), true);
        }
      } finally {
        if (compressPoll) clearInterval(compressPoll);
        state.busy = false;
        state.abort = null;
        el.send.disabled = false;
        el.btnCompress.disabled = false;
        el.btnProbe.disabled = false;
      }
    }

    /* Day08: сжать старую историю в одну сводку (дешёвая модель). */
    async function compressHistory() {
      if (state.busy || !state.instanceId || !state.agentId) return;
      const length = state.messages.length;
      if (length < 6) {
        setStatus("сжатие: история уже короткая (" + length + ")", true);
        return;
      }
      state.busy = true;
      el.send.disabled = true;
      el.btnCompress.disabled = true;
      el.btnProbe.disabled = true;
      setStatus("сжимаю историю…");
      try {
        const data = await api(
          "/api/instances/" + state.instanceId + "/agents/" + state.agentId + "/compress",
          {
            method: "POST",
            // Day09: сжатие — той же моделью, что выбрана в комбобоксе чата
            body: JSON.stringify({
              keepLast: 4,
              model: el.model.value || undefined,
            }),
          },
        );
        state.compressInfo = {
          messageId: data.summary.id,
          beforeTokens: data.before.tokensEstimate,
          afterTokens: data.after.tokensEstimate,
          costRub: data.compression.cost_rub,
        };
        state.session.requests += 1;
        state.session.tokens += data.compression.usage?.total_tokens || 0;
        state.session.cost_rub += data.compression.cost_rub || 0;
        if (data.totals) state.usage = { ...state.usage, ...data.totals };
        clearBanner();
        await loadUsage();
        await loadMessages();
        setStatus(
          "сжато: " + data.compression.summarizedMessages + " сообщ → сводка · ~" +
            fmtTok(data.before.tokensEstimate) + " → ~" + fmtTok(data.after.tokensEstimate) +
            " ток (" + fmtRub(data.compression.cost_rub) + ")",
        );
      } catch (err) {
        if (err.status === 413) showBanner(err.message || "Контекст переполнен");
        setStatus(err.message || String(err), true);
      } finally {
        state.busy = false;
        el.send.disabled = false;
        el.btnCompress.disabled = false;
        el.btnProbe.disabled = false;
      }
    }

    el.btnCompress.addEventListener("click", () => {
      compressHistory();
    });

    /* Day08+: холостой A/B замер экономики сжатия — 4 вызова, тред не меняется.
       A — вопрос на полном хвосте (кэш тёплый) · C — сжатие ·
       B1 — тот же вопрос на сжатом контексте (кэш холодный) · B2 — B1 повторно (тёплый). */
    async function probeCompressEconomics() {
      if (state.busy || !state.instanceId || !state.agentId) return;
      state.busy = true;
      el.send.disabled = true;
      el.btnCompress.disabled = true;
      el.btnProbe.disabled = true;
      el.btnProbe.disabled = true;
      setStatus("замер экономики сжатия… (4 холостых вызова, тред не меняется)");
      try {
        const data = await api(
          "/api/instances/" + state.instanceId + "/agents/" + state.agentId + "/compress/probe",
          { method: "POST", body: JSON.stringify({ keepLast: 4 }) },
        );
        state.session.requests += 4;
        state.session.tokens +=
          (data.full.usage?.total_tokens || 0) +
          (data.compress.usage?.total_tokens || 0) +
          (data.compressedCold.usage?.total_tokens || 0) +
          (data.compressedWarm.usage?.total_tokens || 0);
        state.session.cost_rub +=
          data.full.cost_rub + data.compress.cost_rub +
          data.compressedCold.cost_rub + data.compressedWarm.cost_rub;
        if (data.totals) state.usage = { ...state.usage, ...data.totals };
        await loadUsage();
        renderProbe(data);
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        state.busy = false;
        el.send.disabled = false;
        el.btnCompress.disabled = false;
        el.btnProbe.disabled = false;
        el.btnProbe.disabled = false;
      }
    }

    function renderProbe(d) {
      const a = d.full || {}, c = d.compress || {}, b1 = d.compressedCold || {}, b2 = d.compressedWarm || {};
      const perAsk = (a.cost_rub || 0) - (b2.cost_rub || 0);
      const saveCls = perAsk > 0 ? "good" : "bad";
      const paybackNum = (c.cost_rub || 0) + (b1.cost_rub || 0) - (a.cost_rub || 0);
      let payback;
      if (perAsk <= 0) {
        payback = '<span class="bad">на этом масштабе сжатие не окупается — полный хвост дешевле</span>';
      } else {
        const k = Math.max(1, Math.ceil(paybackNum / perAsk));
        payback = 'сжатие окупается после <b>~' + k + '</b> вопрос' +
          (k % 10 === 1 && k % 100 !== 11 ? "а" : "ов") + ' <span class="good">(Δ ₽' +
          perAsk.toFixed(4) + '/вопрос)</span>';
      }
      el.probeResult.innerHTML =
        "<div><b>Экономика сжатия</b> · вопрос «" + String(d.question || "").slice(0, 60) + "…»</div>" +
        "<div>Было · полный хвост: ~" + fmtTok(a.usage?.prompt_tokens || 0) +
          " промпт-ток · ₽" + Number(a.cost_rub || 0).toFixed(4) + " за вопрос</div>" +
        "<div>Сжатие (разово): ₽" + Number(c.cost_rub || 0).toFixed(4) +
          " · " + (c.summarizedCount || 0) + " сообщ → сводка</div>" +
        "<div>Стало · сжатый хвост: ₽" + Number(b1.cost_rub || 0).toFixed(4) +
          " (холодный кэш) → ₽" + Number(b2.cost_rub || 0).toFixed(4) + " (тёплый)</div>" +
        "<div>Экономия за вопрос на тёплом кэше: <span class='" + saveCls + "'>₽" +
          perAsk.toFixed(4) + "</span> · " + payback + "</div>";
      el.probeResult.hidden = false;
      setStatus("замер готов: 4 вызова оплачены, тред не менялся");
    }

    el.btnProbe.addEventListener("click", () => {
      probeCompressEconomics();
    });

    el.instanceTabs.addEventListener("click", async (e) => {
      const close = e.target.closest("[data-close-instance]");
      if (close) {
        e.preventDefault();
        e.stopPropagation();
        closeInstance(close.dataset.closeInstance).catch((err) =>
          setStatus(err.message, true),
        );
        return;
      }
      const t = e.target.closest(".tab");
      if (!t) return;
      if (state.busy && state.abort) state.abort.abort();
      state.instanceId = t.dataset.instance;
      const inst = currentInstance();
      state.agentId = inst?.agents[0]?.id || null;
      state.lastPayloadMessages = [];
      state.strategyLock = false;
      renderTabs();
      await loadMessages();
    });

    el.agentTabs.addEventListener("click", async (e) => {
      const close = e.target.closest("[data-close-agent]");
      if (close) {
        e.preventDefault();
        e.stopPropagation();
        closeAgent(close.dataset.closeAgent).catch((err) =>
          setStatus(err.message, true),
        );
        return;
      }
      const t = e.target.closest(".tab");
      if (!t) return;
      if (state.busy && state.abort) state.abort.abort();
      state.agentId = t.dataset.agent;
      state.lastPayloadMessages = [];
      state.strategyLock = false;
      renderTabs();
      await loadMessages();
    });

    el.undoToastBtn.addEventListener("click", () => {
      const pending = undoPending;
      if (!pending?.onUndo) return;
      clearUndoToast();
      pending.onUndo().catch((err) => setStatus(err.message, true));
    });

    document.getElementById("add-instance").addEventListener("click", () => {
      addInstance().catch((e) => setStatus(e.message, true));
    });
    document.getElementById("add-agent").addEventListener("click", () => {
      addAgent().catch((e) => setStatus(e.message, true));
    });
    document.getElementById("spawn-agents").addEventListener("click", () => {
      spawnAgents().catch((e) => setStatus(e.message, true));
    });
    document.getElementById("spawn-instances").addEventListener("click", () => {
      spawnInstances().catch((e) => setStatus(e.message, true));
    });
    el.send.addEventListener("click", () => send());
    el.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    if (el.strategyLock) {
      el.strategyLock.addEventListener("change", () => {
        state.strategyLock = el.strategyLock.checked;
        if (state.strategyLock) {
          const v = el.contextStrategy.value || state.contextStrategy;
          if (v) {
            state.contextStrategy = v;
            el.contextStrategy.value = v;
          }
        }
        updateStrategyLockUI();
        renderFactsPanel();
        renderBranchBar();
      });
    }
    if (el.contextStrategy) {
      el.contextStrategy.addEventListener("change", () => {
        state.contextStrategy = el.contextStrategy.value || null;
        if (state.strategyLock && state.contextStrategy) {
          /* keep lock value in sync */
        }
        renderDay10Panels();
      });
    }
    document.getElementById("btn-x3").addEventListener("click", () => {
      setStatus("×3 не always-on — backlog / не must дня");
    });
    el.toggle.addEventListener("click", () => {
      const open = el.details.classList.toggle("open");
      el.toggle.setAttribute("aria-expanded", open ? "true" : "false");
      el.toggle.textContent = open ? "▴" : "▾";
    });

    (async function boot() {
      try {
        await api("/api/health");
        try {
          const me = await api("/api/whoami");
          if (me.ip) el.clientIp.textContent = "Ваш IP · " + me.ip;
        } catch (_) {
          el.clientIp.textContent = "Ваш IP · ?";
        }
        await loadModels();
        await loadUsage();
        await hydrate();
      } catch (err) {
        setStatus(err.message || String(err), true);
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trigger Helper</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f1ec;
      --surface: #fff;
      --text: #1c1c1c;
      --muted: #5c5c5c;
      --accent: #2f6f68;
      --accent-hover: #245850;
      --border: #ddd6cc;
      --error: #9b2c2c;
      --user-bubble: #e8f0ef;
      --bot-bubble: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .topbar {
      flex-shrink: 0;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .topbar h1 {
      font-size: 1.125rem;
      margin: 0;
      font-weight: 600;
    }

    .topbar .sub {
      margin: 4px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }

    .messages-empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 24px;
    }

    .msg {
      max-width: 88%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: #faf8f5;
    }

    .badge.format-json {
      color: #3a4a6b;
      border-color: #c5cde0;
      background: #eef1f8;
    }

    .badge.json-ok {
      color: #1f5c38;
      border-color: #9ec9ae;
      background: #e8f5ee;
    }

    .badge.json-bad {
      color: var(--error);
      border-color: #e0b4b4;
      background: #f8eeee;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .bubble.json {
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      background: #f7f8fb;
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.assistant .bubble.typing {
      color: var(--muted);
      font-style: italic;
    }

    .msg-usage {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .msg-usage summary {
      cursor: pointer;
      user-select: none;
    }

    .msg-usage dl {
      margin: 6px 0 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      font-variant-numeric: tabular-nums;
    }

    .msg-usage dt, .msg-usage dd { margin: 0; }

    .composer-wrap {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }

    .session-bar {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
      min-height: 1em;
    }

    .zone-row {
      margin-bottom: 8px;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    @media (max-width: 420px) {
      .controls-row { grid-template-columns: 1fr; }
    }

    .zone-row label,
    .controls-row label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .zone-row select,
    .controls-row select {
      width: 100%;
      font: inherit;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      font: inherit;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 44px;
      max-height: 120px;
      resize: none;
      line-height: 1.4;
    }

    .input-row button {
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 0 16px;
      cursor: pointer;
    }

    .input-row button:hover:not(:disabled) { background: var(--accent-hover); }
    .input-row button:disabled { opacity: 0.6; cursor: wait; }

    .error {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    .error.visible { display: block; }

    .disclaimer {
      flex-shrink: 0;
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      padding: 6px 12px 8px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Trigger Helper</h1>
      <p class="sub">Верх тела — зона боли и вопрос по самопомощи</p>
    </header>

    <div class="messages" id="messages" aria-live="polite">
      <p class="messages-empty" id="messages-empty">Выберите зону и отправьте сообщение</p>
    </div>

    <div class="composer-wrap">
      <div class="session-bar" id="session-bar"></div>
      <form id="ask-form">
        <div class="controls-row">
          <div>
            <label for="zone">Где болит?</label>
            <select id="zone" name="zone" required>
              <option value="head">Голова</option>
              <option value="shoulder">Плечо (верх, у шеи)</option>
              <option value="arm">Рука</option>
            </select>
          </div>
          <div>
            <label for="format">Формат ответа</label>
            <select id="format" name="format">
              <option value="free">Свободный</option>
              <option value="json">JSON</option>
            </select>
          </div>
        </div>
        <div class="input-row">
          <textarea id="question" name="question" rows="1" required placeholder="Сообщение…"></textarea>
          <button type="submit" id="submit-btn" aria-label="Отправить">Отправить</button>
        </div>
        <p class="error" id="error" role="alert"></p>
      </form>
    </div>

    <p class="disclaimer">Образовательный self-care, не меддиагностика. Не замена врача или массажиста.</p>
  </div>

  <script>
    const zoneToPoint = {
      head: "suboccipital",
      shoulder: "trapezius_upper",
      arm: "forearm_flexors",
    };

    const zoneLabels = {
      head: "Голова",
      shoulder: "Плечо",
      arm: "Рука",
    };

    const form = document.getElementById("ask-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorEl = document.getElementById("error");
    const messagesEl = document.getElementById("messages");
    const messagesEmptyEl = document.getElementById("messages-empty");
    const sessionBarEl = document.getElementById("session-bar");
    const questionEl = document.getElementById("question");

    const USD_TO_RUB = 95;
    const SESSION_KEY = "trigger-helper-demo-session";

    function loadSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (!raw) {
          return { requests: 0, cost_usd: 0, total_tokens: 0, cache_hit_tokens: 0 };
        }
        return JSON.parse(raw);
      } catch {
        return { requests: 0, cost_usd: 0, total_tokens: 0, cache_hit_tokens: 0 };
      }
    }

    function saveSession(session) {
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    }

    let session = loadSession();

    function formatUsd(value) {
      if (value < 0.01) return `$${value.toFixed(6)}`;
      return `$${value.toFixed(4)}`;
    }

    function renderSessionBar() {
      if (session.requests === 0) {
        sessionBarEl.textContent = "";
        return;
      }
      const rub = session.cost_usd * USD_TO_RUB;
      sessionBarEl.textContent =
        `Сессия: ${session.requests} запр. · ${formatUsd(session.cost_usd)} (~${rub.toFixed(2)} ₽) · ${session.total_tokens} tok · кэш ${session.cache_hit_tokens}`;
    }

    function addToSession(usage) {
      session.requests += 1;
      session.cost_usd += usage.estimated_cost_usd;
      session.total_tokens += usage.total_tokens;
      session.cache_hit_tokens += usage.prompt_cache_hit_tokens;
      session.cost_usd = Number(session.cost_usd.toFixed(6));
      saveSession(session);
      renderSessionBar();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideEmpty() {
      if (messagesEmptyEl) messagesEmptyEl.style.display = "none";
    }

    function appendUserMessage(text, zone) {
      hideEmpty();
      const el = document.createElement("div");
      el.className = "msg user";
      el.innerHTML = `
        <span class="msg-meta">${zoneLabels[zone]}</span>
        <div class="bubble"></div>
      `;
      el.querySelector(".bubble").textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function appendTypingIndicator() {
      hideEmpty();
      const el = document.createElement("div");
      el.className = "msg assistant";
      el.dataset.typing = "1";
      el.innerHTML = `<div class="bubble typing">Печатает…</div>`;
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function usageDetailsHtml(usage) {
      const rub = usage.estimated_cost_usd * USD_TO_RUB;
      return `
        <details class="msg-usage">
          <summary>${formatUsd(usage.estimated_cost_usd)} · ${usage.total_tokens} tok · кэш ${usage.prompt_cache_hit_tokens}</summary>
          <dl>
            <dt>Модель</dt><dd>${usage.model}</dd>
            <dt>Кэш hit</dt><dd>${usage.prompt_cache_hit_tokens}</dd>
            <dt>Кэш miss</dt><dd>${usage.prompt_cache_miss_tokens}</dd>
            <dt>Prompt</dt><dd>${usage.prompt_tokens}</dd>
            <dt>Completion</dt><dd>${usage.completion_tokens}</dd>
            <dt>Оценка</dt><dd>${formatUsd(usage.estimated_cost_usd)} (~${rub.toFixed(2)} ₽)</dd>
          </dl>
        </details>
      `;
    }

    function isParseableJson(text) {
      try {
        JSON.parse(text);
        return true;
      } catch {
        return false;
      }
    }

    function replaceTypingWithReply(typingEl, payload) {
      typingEl.removeAttribute("data-typing");
      const format = payload.format || "free";
      const isJson = format === "json";
      let badges = "";
      if (isJson) {
        const ok = isParseableJson(payload.reply);
        badges = [
          `<span class="badge format-json">JSON</span>`,
          ok
            ? `<span class="badge json-ok">✓ JSON Ok</span>`
            : `<span class="badge json-bad">JSON invalid</span>`,
        ].join("");
      }

      typingEl.innerHTML = `
        <span class="msg-meta">Ответ ${badges}</span>
        <div class="bubble${isJson ? " json" : ""}"></div>
        ${payload.usage ? usageDetailsHtml(payload.usage) : ""}
      `;
      typingEl.querySelector(".bubble").textContent = payload.reply;
      scrollToBottom();
    }

    function replaceTypingWithError(typingEl, message) {
      typingEl.innerHTML = `<div class="bubble" style="border-color: var(--error); color: var(--error);"></div>`;
      typingEl.querySelector(".bubble").textContent = message;
      scrollToBottom();
    }

    questionEl.addEventListener("input", () => {
      questionEl.style.height = "auto";
      questionEl.style.height = `${Math.min(questionEl.scrollHeight, 120)}px`;
    });

    questionEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        if (!submitBtn.disabled) {
          form.requestSubmit();
        }
      }
    });

    renderSessionBar();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.classList.remove("visible");

      const zone = document.getElementById("zone").value;
      const format = document.getElementById("format").value;
      const pointId = zoneToPoint[zone];
      const question = questionEl.value.trim();
      if (!question) return;

      appendUserMessage(question, zone);
      questionEl.value = "";
      questionEl.style.height = "auto";

      const typingEl = appendTypingIndicator();
      submitBtn.disabled = true;

      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pointId, question, format }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || `HTTP ${response.status}`);
        }

        replaceTypingWithReply(typingEl, data);
        if (data.usage) addToSession(data.usage);
      } catch (err) {
        replaceTypingWithError(typingEl, err.message || "Не удалось отправить");
      } finally {
        submitBtn.disabled = false;
        questionEl.focus();
        scrollToBottom();
      }
    });
  </script>
</body>
</html>
